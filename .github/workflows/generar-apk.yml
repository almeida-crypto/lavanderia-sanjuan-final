name: Generar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generar-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Revisar el código
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Construir APK
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=https://lavanderia-san-juan-api.onrender.com/api

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: lavanderia-san-juan-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
